name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Core and headless GUI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[cockpit,ai,dev]'
      - name: Run release regression suite
        run: |
          python -m pytest --junitxml=test-results.xml -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-python-${{ matrix.python-version }}
          path: test-results.xml

  manual:
    name: Manual workflow without AI packages
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[cockpit,dev]'
      - name: Verify AI packages are absent
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('google') is None or (importlib.util.find_spec('google.adk') is None and importlib.util.find_spec('google.genai') is None)"
      - name: Run manual research and integrity checks
        run: python -m pytest tests/gui/test_manual_research_flow.py tests/projects tests/biology tests/calibration tests/validation tests/core -q

  build:
    name: Build wheel and manifest
    needs: [core, manual]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build hatchling
      - run: python -m build
      - uses: actions/download-artifact@v4
        with:
          name: junit-python-3.12
          path: test-artifacts
      - name: Generate release manifest from results
        run: |
          python scripts/generate_release_manifest.py \
            --junit test-artifacts/test-results.xml \
            --wheel "$(find dist -maxdepth 1 -name '*.whl' -print -quit)" \
            --output dist/release_manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: dist/
