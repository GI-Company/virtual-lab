name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Core and headless GUI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[cockpit,dev]'
      - name: Run release regression suite
        run: |
          python -m pytest tests/projects tests/computational tests/core tests/instruments tests/protocol \
            virtual_lab/test_matter.py virtual_lab/test_biological.py \
            virtual_lab/test_analysis.py virtual_lab/test_workspace_state.py \
            virtual_lab/test_world_selection.py virtual_lab/test_ai_context_validation.py \
            tests/test_nested_manifest_bundle.py \
            --junitxml=test-results.xml -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-python-${{ matrix.python-version }}
          path: test-results.xml

  build:
    name: Build wheel and manifest
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build hatchling
      - run: python -m build
      - uses: actions/download-artifact@v4
        with:
          name: junit-python-3.12
          path: test-artifacts
      - name: Generate release manifest from results
        run: |
          python scripts/generate_release_manifest.py \
            --junit test-artifacts/test-results.xml \
            --wheel "$(find dist -maxdepth 1 -name '*.whl' -print -quit)" \
            --output dist/release_manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: dist/
