name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Offline core and MS pilot (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.13.6
      - name: Install locked offline runtime and test dependencies
        run: uv sync --locked --extra cockpit --extra pilot --extra dev
      - name: Verify AI packages are absent
        run: uv run --no-sync python -c "import importlib.util; assert importlib.util.find_spec('google') is None"
      - name: Run release and pilot regression suite
        run: uv run --no-sync python -m pytest --junitxml=test-results.xml -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-python-${{ matrix.python-version }}
          path: test-results.xml

  ai-compatibility:
    name: Optional AI compatibility
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked --extra cockpit --extra pilot --extra ai --extra dev
      - run: uv run --no-sync python -m pytest -q

  desktop-smoke:
    name: MS pilot desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked --extra cockpit --extra pilot --extra dev
      - run: uv run --no-sync python -m pytest tests/pilots tests/gui/test_ms_pilot_workspace.py -q

  security:
    name: Locked runtime dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.6
      - run: uv export --locked --extra cockpit --extra pilot --extra mcp --extra research-service --no-emit-project --no-dev --output-file runtime-requirements.txt
      - run: uv tool run --python 3.12 --from pip-audit==2.10.1 pip-audit --disable-pip --no-deps --require-hashes --strict --requirement runtime-requirements.txt --format json --output dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-dependency-audit
          path: dependency-audit.json

  research-service:
    name: Authenticated read-only research service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.6
      - name: Install locked headless service and review tools
        run: uv sync --locked --extra mcp --extra research-service --group service-test --group security
      - name: Confirm optional GUI and cloud-AI SDKs are absent
        run: uv run --no-sync python -c "import importlib.util; assert importlib.util.find_spec('PySide6') is None; assert importlib.util.find_spec('google') is None"
      - name: Check exported service contracts
        run: uv run --no-sync python -m scripts.export_research_service_contract --check
      - name: Scan tracked source for secrets
        run: uv run --no-sync python -m scripts.verify_source_secrets
      - name: Verify engine, integrations and authorization boundary
        run: uv run --no-sync python -m pytest tests/application tests/integrations tests/research_service --junitxml=output/service-tests.xml -q
      - name: Qualify independent HTTP clients against synthetic data
        run: uv run --no-sync python -m scripts.verify_research_service --output output/service-http
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: research-service-synthetic-evidence
          path: |
            output/service-tests.xml
            output/service-http/validation.json
            output/service-http/verified-report.json
            output/service-http/fixture/service-audit.jsonl

  build:
    name: Reproducible pilot wheel and manifest
    needs: [core, ai-compatibility, desktop-smoke, security, research-service]
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: '1793232000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked --extra cockpit --extra pilot --extra dev
      - name: Build twice and verify package bytes
        run: |
          uv build --no-build-isolation --out-dir output/build-a
          uv build --no-build-isolation --out-dir output/build-b
          uv run --no-sync python scripts/verify_pilot_release.py output/build-a output/build-b
      - name: Verify clean non-editable wheel installation without AI
        env:
          QT_QPA_PLATFORM: offscreen
          VIRTUALLAB_DATA_DIR: ${{ github.workspace }}/output/installed-data
        run: |
          uv export --locked --extra cockpit --extra pilot --no-emit-project --no-dev --output-file output/runtime-requirements.txt
          uv venv --python 3.12 output/wheel-env
          uv pip sync --python output/wheel-env/bin/python --require-hashes output/runtime-requirements.txt
          uv pip install --python output/wheel-env/bin/python --no-deps "$(find output/build-a -maxdepth 1 -name '*.whl' -print -quit)"
          output/wheel-env/bin/python scripts/verify_installed_pilot.py --output output/build-a/installed-wheel-smoke.json
      - uses: actions/download-artifact@v4
        with:
          name: junit-python-3.12
          path: output/test-artifacts
      - name: Generate release manifest from test results
        run: |
          uv run --no-sync python scripts/generate_release_manifest.py \
            --junit output/test-artifacts/test-results.xml \
            --wheel "$(find output/build-a -maxdepth 1 -name '*.whl' -print -quit)" \
            --suite "offline regression and MS workflow pilot" \
            --output output/build-a/release_manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: ms-pilot-release-candidate
          path: output/build-a/
