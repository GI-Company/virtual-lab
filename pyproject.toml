[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "virtual_lab"
version = "1.0.0b1"
description = "VirtualLab: Epistemic Research Cockpit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
    "numpy>=2,<3",
    "scipy>=1.15,<2",
    "google-genai>=0.2.2",
    "google-adk>=2.3,<3",
    "PyNaCl>=1.5",
    "pint>=0.24"
]

[project.optional-dependencies]
biology = [
    "alphagenome>=0.9,<0.10",
    "keyring>=25,<26"
]
cockpit = [
    "PySide6>=6.11,<7",
    "rdkit>=2025.9",
    "pyqtgraph==0.14.0",
    "zeroconf==0.132.2"
]
dev = [
    "pytest>=8",
    "pytest-qt>=4"
]
