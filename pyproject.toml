[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "virtual_lab"
dynamic = ["version"]
description = "Scientific desktop cockpit for simulations, computational biology, evidence, and provenance"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pydantic>=2,<3",
    "numpy>=2,<3",
    "scipy>=1.15,<2",
    "keyring>=25,<26",
    "PyNaCl>=1.5",
    "pint>=0.24"
]

[project.optional-dependencies]
research-service = ["starlette>=0.52,<2", "uvicorn>=0.34,<1", "PyJWT[crypto]>=2.15.1,<3"]
mcp = ["mcp>=1.12,<2"]
pilot = ["reportlab>=4,<6"]
ai = [
    "google-genai>=0.2.2",
    "google-adk>=2.10,<3"
]
biology = [
    "alphagenome>=0.9,<0.10"
]
cockpit = [
    # Qt 6.12.0 aborts the Linux navigation shutdown test on Python 3.10/3.11.
    "PySide6>=6.11.3,<6.12",
    "rdkit>=2025.9",
    "pyqtgraph==0.14.0",
    "zeroconf==0.151.5",
    "psutil>=6,<8",
    "websockets>=14,<16"
]
dev = [
    "build==1.6.1",
    "hatchling==1.33.0",
    "pytest>=8",
    "pytest-qt>=4",
    "jsonschema>=4,<5"
]

[project.scripts]
virtuallab-research-service = "virtual_lab.integrations.research_service.server:main"
virtuallab-mcp = "virtual_lab.integrations.mcp.server:main"
virtuallab-ms-pilot = "virtual_lab.pilots.desktop:main"

[project.urls]
Homepage = "https://github.com/GI-Company/virtual-lab"
Repository = "https://github.com/GI-Company/virtual-lab"
Issues = "https://github.com/GI-Company/virtual-lab/issues"

[dependency-groups]
service-test = ["pytest>=8", "jsonschema>=4,<5", "httpx>=0.28,<1"]
security = ["detect-secrets==1.5.0", "pip-audit==2.10.1"]

[tool.hatch.version]
path = "virtual_lab/version.py"

[tool.hatch.build.targets.wheel]
packages = ["virtual_lab"]
exclude = ["**/test_*.py", "**/__pycache__/**", "**/*.pyc"]

[tool.hatch.build.targets.sdist]
include = ["/virtual_lab", "/tests", "/scripts", "/docs", "/integrations", "/protocol", "/examples", "/README.md", "/pyproject.toml", "/uv.lock", "/release_manifest.json", "/start_virtuallab.sh", "/.github", "/.gitignore"]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.hatch.build.targets.sdist.force-include]
"virtual_lab/calibration/data" = "virtual_lab/calibration/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
markers = [
    "live: requires explicitly enabled cloud credentials and network access",
    "mlx: requires explicitly enabled Apple Silicon MLX tests",
]
