[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "virtual_lab"
dynamic = ["version"]
description = "Scientific desktop cockpit for simulations, computational biology, evidence, and provenance"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pydantic>=2,<3",
    "numpy>=2,<3",
    "scipy>=1.15,<2",
    "keyring>=25,<26",
    "PyNaCl>=1.5",
    "rfc8785>=0.1.4,<0.2",
    "pint>=0.24"
]

[project.optional-dependencies]
ai = [
    "google-genai>=0.2.2",
    "google-adk>=2.10,<3"
]
biology = [
    "alphagenome>=0.9,<0.10"
]
cockpit = [
    "PySide6>=6.11,<7",
    "rdkit>=2025.9",
    "pyqtgraph==0.14.0",
    "zeroconf==0.132.2",
    "psutil>=6,<8",
    "websockets>=14,<16"
]
dev = [
    "pytest>=8",
    "pytest-qt>=4",
    "jsonschema>=4,<5"
]

[project.urls]
Homepage = "https://github.com/GI-Company/virtual-lab"
Repository = "https://github.com/GI-Company/virtual-lab"
Issues = "https://github.com/GI-Company/virtual-lab/issues"

[tool.hatch.version]
path = "virtual_lab/version.py"

[tool.hatch.build.targets.wheel]
packages = ["virtual_lab"]
exclude = ["**/test_*.py", "**/__pycache__/**", "**/*.pyc"]

[tool.hatch.build.targets.sdist.force-include]
"virtual_lab/calibration/data" = "virtual_lab/calibration/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
markers = [
    "live: requires explicitly enabled cloud credentials and network access",
    "mlx: requires explicitly enabled Apple Silicon MLX tests",
]
